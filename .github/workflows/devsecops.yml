name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
      - security-assessment
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependency-security:
    name: Dependency Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate npm audit report
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true

      - name: Enforce dependency vulnerability baseline
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          let report;

          try {
            report = JSON.parse(
              fs.readFileSync("npm-audit-report.json", "utf8")
            );
          } catch (error) {
            console.error(
              "Security gate failed: unable to read or parse " +
              "npm-audit-report.json."
            );
            console.error(error.message);
            process.exit(1);
          }

          const vulnerabilities =
            report.metadata &&
            report.metadata.vulnerabilities
              ? report.metadata.vulnerabilities
              : {};

          const low = vulnerabilities.low || 0;
          const moderate = vulnerabilities.moderate || 0;
          const high = vulnerabilities.high || 0;
          const critical = vulnerabilities.critical || 0;
          const total = vulnerabilities.total || 0;

          const acceptedCriticalBaseline = 38;

          console.log("npm dependency vulnerability summary");
          console.log("====================================");
          console.log(`Low: ${low}`);
          console.log(`Moderate: ${moderate}`);
          console.log(`High: ${high}`);
          console.log(`Critical: ${critical}`);
          console.log(`Total: ${total}`);
          console.log(
            `Accepted critical baseline: ${acceptedCriticalBaseline}`
          );

          if (critical > acceptedCriticalBaseline) {
            console.error(
              `Security gate failed: critical vulnerabilities increased ` +
              `from the accepted baseline of ` +
              `${acceptedCriticalBaseline} to ${critical}.`
            );
            process.exit(1);
          }

          console.log(
            "Security gate passed: critical vulnerabilities did not " +
            "increase above the documented legacy baseline."
          );
          NODE

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: error

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: npm

      - name: Verify session secret configuration
        shell: bash
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          if [ -z "$SESSION_SECRET" ]; then
            echo "SESSION_SECRET is not configured."
            exit 1
          fi

          echo "SESSION_SECRET is securely configured."

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: npm test --if-present

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

  secrets-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build NodeGoat image
        run: docker build --no-cache -t nodegoat:${{ github.sha }} .

      - name: Run blocking Trivy OS security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: nodegoat:${{ github.sha }}
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os
          severity: "CRITICAL"

      - name: Generate complete Trivy report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: nodegoat:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy-complete-report.json
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Upload complete Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-complete-report
          path: trivy-complete-report.json
          if-no-files-found: error

  authorization-gate:
    name: Authorization Security Gate
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run custom IDOR Semgrep rule
        run: semgrep scan --config semgrep-rules/nodegoat-idor.yml --error app/routes/allocations.js
